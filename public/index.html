<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Recorder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #333;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .start-btn {
      background: #4CAF50;
      color: white;
    }

    .start-btn:hover:not(:disabled) {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
    }

    .stop-btn {
      background: #f44336;
      color: white;
    }

    .stop-btn:hover:not(:disabled) {
      background: #da190b;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
      color: #666;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status.recording {
      background: #fff3cd;
      color: #856404;
      font-weight: 500;
    }

    .status.recording::before {
      content: '● ';
      animation: pulse 1s infinite;
      color: #f44336;
      margin-right: 8px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .info {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: #1976d2;
      line-height: 1.5;
    }

    .info strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Screen Recorder</h1>
    <p class="subtitle">Record your screen in MP4 format</p>

    <div class="status" id="status">Ready</div>

    <div class="controls">
      <button class="start-btn" id="startBtn">Start Recording</button>
      <button class="stop-btn" id="stopBtn" disabled>Stop Recording</button>
    </div>

    <div class="info">
      <strong>💾 Output Location:</strong>
      <span id="outputPath">output/ folder</span>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const outputPath = document.getElementById('outputPath');

    async function updateStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      updateUI(data.recording);
    }

    function updateUI(recording) {
      startBtn.disabled = recording;
      stopBtn.disabled = !recording;

      if (recording) {
        status.textContent = 'Recording...';
        status.classList.add('recording');
      } else {
        status.textContent = 'Ready';
        status.classList.remove('recording');
      }
    }

    startBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/start', { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          updateUI(true);
          outputPath.textContent = `output/${data.filename}`;
        } else {
          status.textContent = '❌ ' + data.error;
          status.style.background = '#ffebee';
          status.style.color = '#c62828';
        }
      } catch (error) {
        status.textContent = '❌ ' + error.message;
        status.style.background = '#ffebee';
        status.style.color = '#c62828';
      }
    });

    stopBtn.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/stop', { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          updateUI(false);
          status.textContent = 'Recording saved!';
        } else {
          status.textContent = `Error: ${data.error}`;
        }
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      }
    });

    updateStatus();
  </script>
</body>
</html>
